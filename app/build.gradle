plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.myapplication'

    // מעלים חזרה ל-35 כדי שה-RecyclerView יעבוד
    compileSdk 35

    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 27

        // משאירים על 34! זה מה שימנע את הקריסה של פיירבייס
        targetSdk 34

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Android UI
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Navigation
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // Firebase Auth
    implementation libs.firebase.auth

    // Firebase Firestore
    implementation 'com.google.firebase:firebase-firestore:25.0.0'

    // Firebase Storage & Database
    implementation 'com.google.firebase:firebase-storage:21.0.0'
    implementation libs.firebase.database

    // RecyclerView
    implementation libs.recyclerview
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Google Play Services
    implementation("com.google.android.gms:play-services-location:21.0.1")
    implementation("com.google.android.gms:play-services-auth:21.0.0")

    // ⭐ תוספת חשובה: Firebase Messaging (עוזר ל-OneSignal לקבל טוקן מגוגל)
    implementation 'com.google.firebase:firebase-messaging:23.4.1'

    // ⭐ תיקון גרסה: OneSignal מוגדר לגרסה קבועה ויציבה
    implementation 'com.onesignal:OneSignal:5.1.23'

    // Test libs
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}